# Streamlit configuration — shared by all team members.
# See https://docs.streamlit.io/library/advanced-features/configuration

[server]
websocketPingInterval = 10
headless = true
runOnSave = true

[theme]
# Light, food-friendly palette. Feel free to iterate.
primaryColor = "#6B9448"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F9F4"
textColor = "#3D5C22"
font = "sans serif"

[browser]
gatherUsageStats = false
